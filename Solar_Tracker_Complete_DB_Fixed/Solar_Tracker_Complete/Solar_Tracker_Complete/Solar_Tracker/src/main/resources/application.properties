spring.application.name=solar_tracker
server.port=8081

# MySQL connection. The database is created automatically if it does not already exist.
spring.datasource.url=jdbc:mysql://localhost:3306/solar_tracker?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Test12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create/update tables from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
